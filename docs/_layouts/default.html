<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#0B5D44" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D1111" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body class="{{ page.body_class | default: 'page' }}">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark"><img src="{{ '/assets/img/logo.png' | relative_url }}" alt="" width="28" height="28"></span>
        <span>Budgment</span>
      </a>
      <nav class="nav">
        <a href="{{ '/' | relative_url }}#funciones">Funciones</a>
        <a href="{{ '/privacidad/' | relative_url }}">Privacidad</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <p>© {{ site.time | date: '%Y' }} Budgment</p>
      <p>
        <a href="{{ '/privacidad/' | relative_url }}">Política de privacidad</a>
        <span aria-hidden="true">·</span>
        <a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a>
      </p>
    </div>
  </footer>
</body>
</html>
